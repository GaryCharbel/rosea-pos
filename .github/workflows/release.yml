name: release

# Release artifacts are built from a version tag (never from a push to main).
# Each job posts its own Discord embed; Discord posts run on Ubuntu.
on:
  push:
    tags:
      - "v*"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk "rosea-pos-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: rosea-pos-*.apk
      - name: Notify Discord
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          job: "Android APK ${{ github.ref_name }}"
          status: ${{ job.status }}

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "rosea-pos-${{ github.ref_name }}-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rosea-pos-*-windows.zip

  notify-windows:
    name: notify · windows build
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          job: "Windows build ${{ github.ref_name }}"
          status: ${{ needs.windows.result }}

  publish-to-mega:
    name: Upload to MEGA
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload both artifacts to the MEGA folder
        env:
          MEGA_USER: ${{ secrets.MEGA_USER }}
          MEGA_PASS: ${{ secrets.MEGA_PASS }}
          MEGA_FOLDER: ${{ secrets.MEGA_FOLDER }}
        run: |
          if [ -z "$MEGA_USER" ] || [ -z "$MEGA_PASS" ]; then
            echo "::warning::MEGA secrets not set — skipping upload. Artifacts are attached to the run."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y megatools
          dest="${MEGA_FOLDER:-/Root/rosea-pos}"
          find dist -type f \( -name '*.apk' -o -name '*-windows.zip' \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $f -> $dest/"
            megaput --username "$MEGA_USER" --password "$MEGA_PASS" --path "$dest/" "$f"
          done
      - name: Notify Discord
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          job: "Release ${{ github.ref_name }} → MEGA"
          status: ${{ job.status }}
          details: "🚀 **Rosea POS ${{ github.ref_name }}** published to MEGA — `rosea-pos-${{ github.ref_name }}.apk` + `rosea-pos-${{ github.ref_name }}-windows.zip`."
